<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | FitDelivery</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">Fit<span>Delivery</span></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a class="active" href="contact.html">Contact</a>
            <a class="cart-link" href="cart.html">Cart <span class="cart-count"><%= cartCount %></span></a>
        </nav>
    </header>
    <main class="page-main">
        <section class="page-intro">
            <p class="eyebrow">We’re here to help</p>
            <h1>Contact us</h1>
            <p>Have a question about an order, delivery, or our meals? Send us a message.</p>
        </section>
        <form class="form-card" id="validateform" onsubmit="return validateform(event)">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="query">Nature of query</label>
            <select id="query" name="query" required>
                <option value="">Select a query</option>
                <option value="order">Order</option>
                <option value="delivery">Delivery</option>
                <option value="other">Other</option>
            </select>
            <button class="button button-primary" type="submit">Send message</button>
            <p class="form-success" id="contactFeedback" role="status" hidden></p>
        </form>
    </main>
    <footer><span>© 2026 FitDelivery</span><a href="menu.html">Browse meals</a></footer>
    <script src="/script.js"></script>
</body>
</html>
